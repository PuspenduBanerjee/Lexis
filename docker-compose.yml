services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: lexis-api:latest
    environment:
      # pydantic-settings parses list-typed env vars as JSON.
      LEXIS_CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - lexis-data:/data
    expose:
      - "8000"
    healthcheck:
      # Script file, not an inline `python -c "..."` - Podman flattens a multi-word
      # exec-form healthcheck and breaks the -c script (see docker/healthcheck.py).
      test: ["CMD", "python", "/usr/local/bin/lexis-healthcheck.py"]
      # Fast probes during startup (Engine 25.0+): failures inside start_period
      # don't count against `retries`, and the first success flips the container
      # to `healthy` and switches to the slower `interval` below. Keeps `web`
      # (depends_on: condition: service_healthy) from waiting a full `interval`.
      start_period: 40s
      start_interval: 5s
      interval: 60s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: lexis-web:latest
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  lexis-data:
