name: Publish container images

# Builds the two Lexis images (backend API + frontend/nginx) and pushes them to
# the GitHub Container Registry - and to Docker Hub when the DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN repo secrets are set.
#
# Runs ONLY on a release tag `vX.Y.Z` (which must sit on `main` - enforced below),
# plus manual `workflow_dispatch`. It does not run on pull requests or branch
# pushes, so day-to-day PRs into develop/main don't build or publish images.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lexis-api
            dockerfile: docker/backend.Dockerfile
            description: "Lexis API - FastAPI backend and MCP endpoint for Ossie semantic models"
          - image: lexis-web
            dockerfile: docker/frontend.Dockerfile
            description: "Lexis web UI - React SPA served by nginx, proxying /api to the Lexis API"
    steps:
      - name: Verify the tag sits on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${{ github.sha }}" --jq '.status')
          echo "tagged commit is '$status' relative to main"
          case "$status" in
            identical|behind) ;;  # the tag is on main (its tip, or a few commits back)
            *) echo "::error::tag ${{ github.ref_name }} points at a commit not on main ($status) - not publishing"; exit 1 ;;
          esac

      - uses: actions/checkout@v5

      - name: Resolve package version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=0.0.0" >> "$GITHUB_OUTPUT"   # workflow_dispatch from a branch
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry targets
        id: reg
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          images="ghcr.io/${OWNER}/${IMAGE}"
          dockerhub=false
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            images="${images}"$'\n'"docker.io/${DOCKERHUB_USERNAME}/${IMAGE}"
            dockerhub=true
          fi
          {
            echo "images<<EOF"
            printf '%s\n' "${images}"
            echo "EOF"
            echo "dockerhub=${dockerhub}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.reg.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.images }}
          # `org.opencontainers.image.description` is what GHCR/Docker Hub show as
          # the package description; without it GHCR nags. Set per-image here
          # (metadata-action's auto value is the shared repo description).
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            LEXIS_VERSION=${{ steps.ver.outputs.v }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
