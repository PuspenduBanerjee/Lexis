server {
    listen 8080;
    server_name _;

    # `resolver` for the runtime DNS lookup in `location /api/` below. Generated
    # from the container's /etc/resolv.conf at startup by
    # docker/nginx-resolver.sh (-> /docker-entrypoint.d/20-lexis-resolver.sh);
    # the image also ships a build-time default so `include` never fails.
    include /etc/nginx/lexis-resolver.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the app's default LEXIS_MAX_DUCKDB_UPLOAD_MB=50 (src/lexis_api/config.py)
    # with headroom, so nginx doesn't 413 an upload before the app gets to enforce its own limit.
    client_max_body_size 60m;

    # "api" is the compose/pod service name for the backend, resolvable only on
    # that network - matching the dev-mode Vite proxy (frontend/vite.config.ts) so
    # the SPA always calls same-origin `/api/...`.
    #
    # The upstream is a variable (not a literal host) so nginx re-resolves it per
    # request via the `resolver` above, honouring `valid=`. With a literal host
    # nginx caches the backend's IP at worker start, and `compose up
    # --force-recreate api` (new container IP) then 502s every /api/* call until
    # nginx itself is restarted. `proxy_pass` with no path + a variable forwards
    # the original request URI unchanged, so `/api/foo` still reaches `/api/foo`.
    location /api/ {
        set $lexis_api_upstream "api:8000";
        proxy_pass http://$lexis_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
