[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantica"
version = "0.1.0"
description = "OSI-native semantic layer: author models once, transpile to warehouse-native SQL and BI/AI consumer formats"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "duckdb>=1.0",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "duckdb>=1.0",
    "snowflake-connector-python>=3.12",
]

[project.scripts]
semantica = "semantica.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semantica", "src/semantica_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
