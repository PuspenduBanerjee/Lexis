[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexis-cli"
version = "0.1.0"
description = "Ossie-native semantic layer: author models once, transpile to warehouse-native SQL and BI/AI consumer formats"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Puspendu Banerjee" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/PuspenduBanerjee/Lexis"
Repository = "https://github.com/PuspenduBanerjee/Lexis"
Issues = "https://github.com/PuspenduBanerjee/Lexis/issues"

[project.optional-dependencies]
mcp = [
    "mcp>=1.9,<2",
    "anyio>=4.0",
    "duckdb>=1.0",
    "snowflake-connector-python>=3.12",
]
dev = [
    "pytest>=8.0",
    "duckdb>=1.0",
    "httpx2>=2.0",
    "jsonschema>=4.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "duckdb>=1.0",
    "snowflake-connector-python>=3.12",
    "mcp>=1.9,<2",
]

[project.scripts]
lexis = "lexis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lexis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = ["third_party", ".git", ".venv", "node_modules"]
