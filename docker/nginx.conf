server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the app's default LEXIS_MAX_DUCKDB_UPLOAD_MB=50 (src/lexis_api/config.py)
    # with headroom, so nginx doesn't 413 an upload before the app gets to enforce its own limit.
    client_max_body_size 60m;

    # "api" is the docker-compose service name for the backend - this proxy only
    # resolves inside that compose network, matching the dev-mode Vite proxy
    # (frontend/vite.config.ts) so the SPA always calls same-origin `/api/...`.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
