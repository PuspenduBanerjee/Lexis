services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: semantica-api:latest
    environment:
      # pydantic-settings parses list-typed env vars as JSON.
      SEMANTICA_CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - semantica-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/users/me')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: semantica-web:latest
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  semantica-data:
