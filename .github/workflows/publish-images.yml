name: Publish container images

# Builds the two Lexis images (backend API + frontend/nginx) and pushes them to
# the GitHub Container Registry, and additionally to Docker Hub when the
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets are set. Pull requests build
# both images to catch Dockerfile breakage but do not push.
on:
  push:
    branches: ["main"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: ["main"]
    paths:
      - "docker/**"
      - "src/**"
      - "frontend/**"
      - "pyproject.toml"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lexis-api
            dockerfile: docker/backend.Dockerfile
          - image: lexis-web
            dockerfile: docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry targets
        id: reg
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          images="ghcr.io/${OWNER}/${IMAGE}"
          dockerhub=false
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            images="${images}"$'\n'"docker.io/${DOCKERHUB_USERNAME}/${IMAGE}"
            dockerhub=true
          fi
          {
            echo "images<<EOF"
            printf '%s\n' "${images}"
            echo "EOF"
            echo "dockerhub=${dockerhub}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.reg.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
